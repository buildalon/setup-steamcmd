name: validate
on:
  schedule:
    - cron: '0 0 * * 0' # every sunday at midnight
  push:
    branches: ['main']
  pull_request:
    branches: ['*']
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
concurrency:
  group: ${{ github.ref }}
jobs:
  validate:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - name: buildalon/setup-steamcmd
        id: setup-steamcmd
        uses: ./
      - run: |
          echo "path: ${{ steps.setup-steamcmd.outputs.path }}"
          echo "version: ${{ steps.setup-steamcmd.outputs.version }}"
          test -f "${{ steps.setup-steamcmd.outputs.path }}"
          echo "STEAM_CMD: $STEAM_CMD"
          echo "STEAM_DIR: $STEAM_DIR"
          which steamcmd > /dev/null
          steamcmd +login anonymous +help +quit
        shell: bash
